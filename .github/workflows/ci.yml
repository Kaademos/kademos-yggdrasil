name: CI

# Mirrors the CircleCI lint / test / manifest jobs onto GitHub Actions, which is
# unmetered for public repositories. Every step drives the same Makefile target
# a contributor runs locally, so a green run here and a green `make test` cannot
# diverge.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint, format and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            gatekeeper/package-lock.json
            flag-oracle/package-lock.json

      - name: Install control-plane dependencies
        run: |
          (cd gatekeeper && npm ci)
          (cd flag-oracle && npm ci)

      # Doubles as the clean-clone typecheck: the checkout contains tracked
      # files only, so a full tsc here reproduces a fresh clone and catches a
      # source file that was never committed.
      - name: make test-lint
        run: make test-lint

  test:
    name: Unit and realm suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            gatekeeper/package-lock.json
            flag-oracle/package-lock.json

      - name: Install control-plane dependencies
        run: |
          (cd gatekeeper && npm ci)
          (cd flag-oracle && npm ci)

      - name: Install realm dependencies
        run: |
          for realm in _template alfheim asgard helheim jotunheim midgard \
                       muspelheim nidavellir niflheim vanaheim; do
            echo "-- $realm --"
            ( cd "realms/$realm" && npm ci )
          done

      - name: make test-unit
        run: make test-unit JEST_FLAGS=--coverage

      - name: make test-realms
        run: make test-realms

      - name: E2E collection guard
        run: |
          npm install -D @playwright/test
          make test-e2e-collect

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            gatekeeper/coverage
            flag-oracle/coverage
          retention-days: 7
          if-no-files-found: ignore

  manifests:
    name: Validate realm manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: flag-oracle/package-lock.json

      - name: Install flag-oracle dependencies
        run: (cd flag-oracle && npm ci)

      - name: make test-manifests
        run: |
          npm install -D @playwright/test
          make test-manifests

      - name: make test-attack-traces
        run: make test-attack-traces

  no-committed-flags:
    name: No flag values in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flags are per-deployment secrets generated by `make setup`. Realms fail
      # closed without one, so a literal reappearing in the tree means a fallback
      # has crept back in — which is exactly how the published flag values got
      # there the first time. Test fixtures are the one legitimate use, and they
      # are confined to tests/ with an obviously synthetic value.
      - name: Scan for hardcoded flag literals
        run: |
          set -o pipefail
          matches=$(grep -rn --binary-files=without-match \
            -E 'YGGDRASIL\{[A-Z]+:[0-9a-fA-F-]{36}\}' \
            realms gatekeeper/src flag-oracle/src docker-compose.yml \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=coverage \
            --exclude-dir=target --exclude-dir=tests \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::Hardcoded flag literal(s) found outside test fixtures:"
            echo "$matches"
            exit 1
          fi
          echo "No hardcoded flag literals in source. ✅"

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # CI-config policy check plus the enhanced secret scan. Both live in the
      # Makefile, so `make test-security` locally runs exactly this.
      - name: make test-security
        run: make test-security

      # Non-blocking: complements the Snyk gate that still runs on CircleCI.
      - name: Audit dependencies
        run: |
          (cd gatekeeper && npm audit --audit-level=high) || true
          (cd flag-oracle && npm audit --audit-level=high) || true

  integration:
    name: Build and smoke test the full stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `make setup`, not `cp .env.example .env`. The example file ships with
      # empty flags and realms now refuse to start without one, so copying it
      # would fail — correctly, but confusingly. setup generates a full set.
      - name: make setup
        run: make setup

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for services to report healthy
        run: |
          for i in $(seq 1 60); do
            unhealthy=$(docker compose ps --format '{{.Service}} {{.Health}}' \
              | awk '$2 != "healthy" && $2 != "" { print $1 }')
            [ -z "$unhealthy" ] && echo "All services healthy." && exit 0
            sleep 5
          done
          echo "::error::Services still unhealthy: $unhealthy"
          docker compose ps
          docker compose logs --tail=50
          exit 1

      - name: make quick-test
        run: make quick-test

      - name: Smoke tests
        run: bash scripts/smoke-test.sh

      # The flag the player captures must be the one this deployment generated,
      # not a value baked into an image or a stale database volume. This is the
      # regression test for the flag exposure that prompted the fail-closed work.
      - name: Realm flag matches the generated deployment flag
        run: |
          set -euo pipefail
          expected=$(grep '^NIDAVELLIR_FLAG=' .env | cut -d= -f2-)
          actual=$(docker exec nidavellir-db psql -U dwarf_admin -d nidavellir -tAc \
            "SELECT access_code FROM secrets WHERE realm='NIDAVELLIR';")
          if [ "$expected" != "$actual" ]; then
            echo "::error::Seeded flag does not match .env"
            exit 1
          fi
          echo "Seeded flag matches the generated deployment flag."

      - name: Realms refuse to start without a flag
        run: |
          set -euo pipefail
          if docker run --rm -e FLAG= "$(docker inspect niflheim --format '{{.Config.Image}}')" 2>&1 \
             | grep -q 'FLAG is not set'; then
            echo "Realm failed closed as expected."
          else
            echo "::error::Realm started (or failed differently) without a FLAG"
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
