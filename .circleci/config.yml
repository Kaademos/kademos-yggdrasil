version: 2.1

jobs:
  # ----------------------
  # LINT JOB
  # ----------------------
  lint:
    docker:
      - image: cimg/node:20.17.0
    working_directory: ~/project

    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-npm-deps-{{ checksum "gatekeeper/package-lock.json" }}-{{ checksum "flag-oracle/package-lock.json" }}
            - v1-npm-deps-

      - run:
          name: Install gatekeeper dependencies
          command: |
            cd gatekeeper
            npm ci

      - run:
          name: Install flag-oracle dependencies
          command: |
            cd flag-oracle
            npm ci

      - save_cache:
          key: v1-npm-deps-{{ checksum "gatekeeper/package-lock.json" }}-{{ checksum "flag-oracle/package-lock.json" }}
          paths:
            - gatekeeper/node_modules
            - flag-oracle/node_modules

      # Lint, format and type check — defined once in the Makefile so a local
      # `make test-lint` and this step can never diverge.
      #
      # This doubles as the clean-clone typecheck: CircleCI's `checkout`
      # contains tracked files ONLY, so a full `tsc` here reproduces a fresh
      # clone. If a required source is gitignored or was never committed (e.g.
      # a hand-written .d.ts swept up by a broad `*.d.ts` rule), it fails here
      # rather than in the Docker build or on a contributor's first
      # `make yggdrasil`.
      - run:
          name: Lint, format and type check (make test-lint)
          command: make test-lint

  # ----------------------
  # UNIT TEST JOB
  # ----------------------
  test:
    docker:
      - image: cimg/node:20.17.0
    working_directory: ~/project

    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-npm-deps-{{ checksum "gatekeeper/package-lock.json" }}-{{ checksum "flag-oracle/package-lock.json" }}
            - v1-npm-deps-

      - run:
          name: Install gatekeeper dependencies
          command: |
            cd gatekeeper
            npm ci

      - run:
          name: Install flag-oracle dependencies
          command: |
            cd flag-oracle
            npm ci

      - run:
          name: Install realm dependencies
          command: |
            for realm in _template alfheim asgard helheim jotunheim midgard \
                         muspelheim nidavellir niflheim vanaheim; do
              echo "-- $realm --"
              ( cd "realms/$realm" && npm ci )
            done

      # Service unit tests. Same Makefile target as a local `make test-unit`;
      # JEST_FLAGS adds coverage here without forking the command.
      # (attack-trace-integration is part of flag-oracle's jest run, so the
      # separate step it used to have was redundant.)
      - run:
          name: Service unit tests (make test-unit)
          command: make test-unit JEST_FLAGS=--coverage

      # Realm suites — 472 tests across ten realm packages. These previously ran
      # in neither CI nor any make target, so realm regressions were invisible.
      - run:
          name: Realm test suites (make test-realms)
          command: make test-realms

      # Guards the Playwright config itself: asserts the suite still collects.
      # Needs no browser and no running platform. Without it, a stray Jest-style
      # file under tests/ can collapse the whole e2e suite to zero tests — which
      # is what happened before 1.6.0, invisible because every other CI step
      # names an explicit spec path.
      - run:
          name: E2E collection guard (make test-e2e-collect)
          command: |
            npm install -D @playwright/test
            make test-e2e-collect

      - store_artifacts:
          path: flag-oracle/coverage
          destination: flag-oracle-coverage

      - store_artifacts:
          path: gatekeeper/coverage
          destination: gatekeeper-coverage

      - run:
          name: Upload coverage to Codecov
          command: |
            curl -s https://uploader.codecov.io/latest/linux/codecov -o /tmp/codecov
            chmod +x /tmp/codecov
            /tmp/codecov \
              -f flag-oracle/coverage/lcov.info \
              -f gatekeeper/coverage/lcov.info \
              -F unittests \
              -n codecov-umbrella

 
  security:
    docker:
      - image: cimg/node:20.17.0
    working_directory: ~/project

    steps:
      - checkout

      # CI-config policy check + enhanced secret scan, both defined in the
      # Makefile so `make test-security` locally runs exactly this.
      - run:
          name: Security validation (make test-security)
          command: make test-security

      - run:
          name: Audit dependencies (gatekeeper - non-blocking, complements Snyk)
          command: |
            cd gatekeeper
            npm audit --audit-level=high || true

      - run:
          name: Audit dependencies (flag-oracle - non-blocking, complements Snyk)
          command: |
            cd flag-oracle
            npm audit --audit-level=high || true

  # ----------------------
  # VALIDATE VULNERABILITY MANIFESTS
  # ----------------------
  validate-manifests:
    docker:
      - image: cimg/node:20.17.0
    working_directory: ~/project

    steps:
      - checkout

      # make test-manifests drives the validator through flag-oracle's ts-node,
      # matching how the repo invokes it everywhere else.
      - run:
          name: Install flag-oracle dependencies
          command: |
            cd flag-oracle
            npm ci

      # Runs create-all-manifests.sh, the validator script, AND the invariant tests: ten realms,
      # unique names and levels, full A01-A10 coverage, well-formed
      # CWE/CVSS/endpoint data. No browser or running platform needed.
      - run:
          name: Validate manifests (make test-manifests)
          command: |
            npm install -D @playwright/test
            make test-manifests

  # ----------------------
  # VALIDATE ATTACK TRACES
  # ----------------------
  validate-attack-traces:
    docker:
      - image: cimg/node:20.17.0
    working_directory: ~/project

    steps:
      - checkout

      # Non-blocking policy lives in the Makefile target, so a local run and this
      # step behave identically.
      - run:
          name: Validate attack trace format (make test-attack-traces)
          command: make test-attack-traces

  # ----------------------
  # SNYK SECURITY GATE (blocking for Gatekeeper + Flag-Oracle)
  # ----------------------
  snyk-secure-core:
    docker:
      - image: cimg/node:20.17.0
    working_directory: ~/project
    # SNYK_TOKEN must be defined in CircleCI project settings
    # The CLI will automatically use it for authentication

    steps:
      - checkout

      - run:
          name: Install Snyk CLI
          command: |
            sudo npm install -g snyk

      # --- Gatekeeper scans ---

      - run:
          name: Snyk Open Source (deps) - gatekeeper
          command: |
            cd gatekeeper
            snyk test --severity-threshold=high

      - run:
          name: Snyk Code (SAST) - gatekeeper
          command: |
            cd gatekeeper
            # No excludes: the hardcoded seed credential these paths were suppressed
            # for is fixed, not hidden. Auth paths are fully in scope for the gate.
            snyk code test --severity-threshold=high

      # --- Flag-Oracle scans ---

      - run:
          name: Snyk Open Source (deps) - flag-oracle
          command: |
            cd flag-oracle
            snyk test --severity-threshold=high

      - run:
          name: Snyk Code (SAST) - flag-oracle
          command: |
            cd flag-oracle
            # No excludes: the repo-wide scan reports nothing in flag-repository.ts,
            # so the suppression was stale. Validation paths are in scope for the gate.
            snyk code test --severity-threshold=high

      # Optional: send snapshots to Snyk UI (non-blocking)
      - run:
          name: Snyk monitor snapshots (non-blocking)
          command: |
            set +e
            cd gatekeeper
            snyk monitor || echo "Snyk monitor failed for gatekeeper (non-blocking)."
            cd ../flag-oracle
            snyk monitor || echo "Snyk monitor failed for flag-oracle (non-blocking)."

  # ----------------------
  # BUILD + INTEGRATION / E2E JOB
  # ----------------------
  build-and-integration:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/project

    steps:
      - checkout

      - run:
          name: Create .env from example
          command: |
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              echo ".env.example not found" >&2
              exit 1
            fi

      - run:
          name: Build Docker images
          command: docker-compose build

      - run:
          name: Start services
          command: docker-compose up -d

      - run:
          name: Wait for services to be ready
          command: sleep 30

      - run:
          name: Check service health
          command: |
            set -e
            docker-compose ps
            curl -f http://localhost:8080/health || (docker-compose logs && exit 1)
            echo "Gatekeeper is healthy - all dependent services are operational"

      - run:
          name: Install Playwright
          command: |
            npm install -D @playwright/test
            # Set environment to avoid interactive prompts and service restarts
            export DEBIAN_FRONTEND=noninteractive
            export NEEDRESTART_MODE=a
            export NEEDRESTART_SUSPEND=1
            # Install system dependencies non-interactively (skip service restarts)
            # Use full path to npx with sudo
            sudo -E bash -c "export PATH=$PATH && $(which npx) playwright install-deps chromium"
            # Install Playwright browsers
            npx playwright install chromium

      # The WHOLE Playwright suite, via the same Makefile target a developer
      # runs. Previously CI named five specs explicitly, which meant
      # tests/e2e/journey/isolation.spec.ts and
      # tests/scanner-benchmark/manifest-accuracy.spec.ts were never executed
      # anywhere, and a new spec would silently never run until someone
      # remembered to add a step here.
      #
      # `make test-e2e` splits the run into blocking and non-blocking using
      # E2E_SOFT_SPECS from the Makefile, so the soft-fail policy lives in one
      # place instead of as `|| echo` scattered through this file.
      - run:
          name: Full E2E suite (make test-e2e)
          command: make test-e2e

      # smoke-test, the m3/m4/m5 suites, the automated exploit journey, and the
      # realm regression checks — all defined in the Makefile target so a local
      # `make test-integration` runs exactly this set.
      - run:
          name: Integration suites (make test-integration)
          command: make test-integration

      - run:
          name: Cleanup Docker resources
          when: always
          command: docker-compose down -v

workflows:
  version: 2

  build-and-test:
    jobs:
      - lint:
          filters:
            branches:
              only:
                - main
                - develop

      - test:
          requires:
            - lint
          filters:
            branches:
              only:
                - main
                - develop

      - validate-manifests:
          requires:
            - lint
          filters:
            branches:
              only:
                - main
                - develop

      - validate-attack-traces:
          requires:
            - lint
          filters:
            branches:
              only:
                - main
                - develop

      - security:
          requires:
            - lint
          filters:
            branches:
              only:
                - main
                - develop

      - snyk-secure-core:
          requires:
            - lint
          filters:
            branches:
              only:
                - main
                - develop

      - build-and-integration:
          requires:
            - test
            - validate-manifests
            - validate-attack-traces
            - security
            - snyk-secure-core
          filters:
            branches:
              only:
                - main
                - develop
