services:
  loki:
    image: grafana/loki:2.9.3
    container_name: yggdrasil-loki
    user: "10001:10001"
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - yggdrasil_main
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.3
    container_name: yggdrasil-promtail
    volumes:
      - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - yggdrasil_main
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: yggdrasil-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - yggdrasil_main
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.2
    container_name: yggdrasil-grafana
    ports:
      - "${GRAFANA_PORT:-3200}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - yggdrasil_main
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

networks:
  yggdrasil_main:
    external: true

volumes:
  loki_data:
  prometheus_data:
  grafana_data:
