# Server Configuration
server.port=${PORT:3000}
spring.application.name=svartalfheim

# Flag Configuration
# No default: startup fails when FLAG is unset, so no deployment can run on a
# value published in the repository. Run `make setup` to generate flags.
app.flag=${FLAG}
app.realm.name=${REALM_NAME:svartalfheim}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Actuator Configuration (Health Endpoint)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/

# Logging
logging.level.root=INFO
logging.level.com.yggdrasil.svartalfheim=DEBUG
